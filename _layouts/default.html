<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-68XPQ1X6ZF');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=3.7">
  <link rel="stylesheet" href="{{ '/assets/css/monograph.css' | relative_url }}?v=3.7">
  <style>
    /* Critical Broadsheet Core Styling */
    :root {
      --bg-color: #fbf9f4;
      --bg-secondary: #f3eee3;
      --text-color: #141413;
      --text-muted: #54504a;
      --border-dark: #141413;
      --border-color: #ded8cb;
      --accent-color: #991b1b;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--text-color); }
    .nav-text-short { display: none; }
  </style>
  {% feed_meta %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v=3.6" defer></script>
  <script src="{{ '/assets/js/monograph.js' | relative_url }}?v=3.6" defer></script>
</head>
<body>
  <div id="reading-progress" class="reading-progress-bar"></div>
  <div class="site-wrapper">
    {% include header.html %}

    <main class="site-main">
      <div class="container">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
